# LOCALHOST ONLY -- local vibe coding does NOT use wrangler/pages deploy.
# Use php artisan serve (127.0.0.1:8000) + Vite (localhost:5173).
# Deploy only happens on push to master via .github/workflows/deploy.yml
# Cloudflare Pages configuration for the Eddyson Aromin portfolio.
# Bindings here are injected into the Pages Functions at deploy time.
name = "aromin-resume"
pages_build_output_dir = "frontend/dist"
compatibility_date = "2025-01-15"

# D1 -- projects, blog posts, contact messages (mirrors the Laravel SQLite DB).
[[d1_databases]]
binding = "blog_db"
database_name = "blog-db"
database_id = "02e5d1d4-c392-4ba4-bbf0-d3e71de230c6"
