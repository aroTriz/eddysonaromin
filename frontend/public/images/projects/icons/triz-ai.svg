<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Terminal-style rounded square with thin border -->
  <rect width="100" height="100" rx="16" fill="#000000" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Terminal dots (red, yellow, green) -->
  <circle cx="20" cy="22" r="4" fill="#ff5f56"/>
  <circle cx="34" cy="22" r="4" fill="#ffbd2e"/>
  <circle cx="48" cy="22" r="4" fill="#27c93f"/>

  <!-- TZ monogram in terminal style -->
  <text x="50" y="72" font-family="'JetBrains Mono','Courier New',monospace" font-size="44" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-1">TZ</text>
</svg>
