    <!-- Pre-paint theme: runs in <head> before any paint. Applies the
         persisted preference to <html> AND sets the background inline so a
         refresh never flashes white in dark mode. Matches --bg in main.css
         (light #fff / dark rgb(12 12 15)). The app clears the inline bg
         once it mounts (useTheme), letting the CSS variables take over. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var pref = stored === 'dark' || stored === 'light' || stored === 'system' ? stored : 'system'
          var hour = new Date().getHours()
          var dark =
            pref === 'dark' || (pref === 'system' && !(hour >= 7 && hour < 18))
          var root = document.documentElement
          if (dark) root.classList.add('dark')
          root.style.backgroundColor = dark ? '#0c0c0f' : '#ffffff'
        } catch (e) {}
      })()
    </script>

    <!-- Open Graph -->
