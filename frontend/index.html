<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />

    <title>Eddyson Aromin — IT Portfolio</title>
    <meta
      name="description"
      content="I'm Eddyson Tristan Aromin — a BS Information Technology graduate and Junior Front-End Developer. I build modern web apps, mobile apps, and generative AI products."
    />
    <meta name="author" content="Eddyson Tristan B. Aromin" />
    <meta name="robots" content="index, follow" />

    <!-- Pre-paint theme: runs in <head> before any paint. Applies the
         persisted preference to <html> AND sets the background inline so a
         refresh never flashes the wrong color. Defaults to LIGHT on first
         visit (matches --bg in main.css: light #fff / dark rgb(12 12 15)).
         The app clears the inline bg once it mounts (useTheme), letting the
         CSS variables take over. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var pref = stored === 'dark' || stored === 'light' || stored === 'system' ? stored : 'light'
          var hour = new Date().getHours()
          var dark =
            pref === 'dark' || (pref === 'system' && !(hour >= 7 && hour < 18))
          var root = document.documentElement
          if (dark) root.classList.add('dark')
          root.style.backgroundColor = dark ? '#0c0c0f' : '#ffffff'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.content = dark ? '#0c0c0f' : '#ffffff'
        } catch (e) {}
      })()
    </script>

    <!-- Session loader (greyfolio-style) — theme-aligned via html.dark -->
    <style>
      #session-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #0a0a0a;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      html.dark #session-loader {
        background: #0c0c0f;
        color: #f4f4f5;
      }
      #session-loader.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .session-loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.1rem;
      }
      .session-loader-wordmark {
        font-family: 'Geist Mono', ui-monospace, 'SF Mono', monospace;
        font-size: clamp(1.15rem, 3vw, 1.6rem);
        letter-spacing: 0.02em;
      }
      .session-loader-track {
        width: min(220px, 60vw);
        height: 2px;
        border-radius: 999px;
        overflow: hidden;
        position: relative;
        background: rgba(10, 10, 10, 0.12);
      }
      html.dark .session-loader-track {
        background: rgba(244, 244, 245, 0.14);
      }
      .session-loader-track span {
        position: absolute;
        inset: 0;
        width: 40%;
        background: currentColor;
        border-radius: 999px;
        animation: sl-load 1.1s ease-in-out infinite;
      }
      @keyframes sl-load {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
    </style>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Eddyson Aromin" />
    <meta property="og:title" content="Eddyson Aromin — IT Portfolio" />
    <meta
      property="og:description"
      content="Full-stack developer building modern web apps, mobile apps, and generative AI products."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Eddyson Aromin — IT Portfolio" />
    <meta
      name="twitter:description"
      content="Full-stack developer building modern web apps, mobile apps, and generative AI products."
    />

    <!-- Geist + Geist Mono (Google Fonts) + Source Serif 4 (serif quotes).
         Loaded non-blocking (media=print + onload swap) so first paint never
         waits on the font stylesheet; display=swap handles the FOUT. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@300..600&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@300..600&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@300..600&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      />
    </noscript>
  </head>
  <body>
    <!-- Session loader — removed by App.vue once the app is ready -->
    <div id="session-loader" role="status" aria-label="Loading Eddyson Aromin's portfolio" aria-live="polite">
      <div class="session-loader-content">
        <span class="session-loader-wordmark">&lt; Aromin /&gt;</span>
        <span class="session-loader-track" aria-hidden="true"><span></span></span>
      </div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
